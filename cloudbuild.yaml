options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/tmdb-repo/tmdb-go:$SHORT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/tmdb-repo/tmdb-go:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'sed -i "s/<PROJECT_ID>/$PROJECT_ID/g" k8s/gke/deployment.yaml'

  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - '--filename=k8s/gke/'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/tmdb-repo/tmdb-go:$SHORT_SHA'
      - '--location=us-central1'
      - '--cluster=tmdb-cluster'
      - '--namespace=tmdb'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/tmdb-repo/tmdb-go:$SHORT_SHA'
