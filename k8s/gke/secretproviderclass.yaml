apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tmdb-secrets
  namespace: tmdb
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/tmdb-api-key/versions/latest"
        fileName: "TMDB_API_KEY"
      - resourceName: "projects/PROJECT_ID/secrets/tmdb-go-database-url/versions/latest"
        fileName: "GO_DATABASE_URL"
      - resourceName: "projects/PROJECT_ID/secrets/tmdb-instance-connection-name/versions/latest"
        fileName: "INSTANCE_CONNECTION_NAME"
  secretObjects:
    - secretName: tmdb-config
      type: Opaque
      data:
        - objectName: TMDB_API_KEY
          key: TMDB_API_KEY
        - objectName: GO_DATABASE_URL
          key: GO_DATABASE_URL
        - objectName: INSTANCE_CONNECTION_NAME
          key: INSTANCE_CONNECTION_NAME
