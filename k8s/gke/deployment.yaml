apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmdb-api
  namespace: tmdb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tmdb-api
  template:
    metadata:
      labels:
        app: tmdb-api
    spec:
      serviceAccountName: tmdb-ksa
      containers:
        - name: tmdb-api
          image: tmdb-go
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          env:
            - name: TMDB_BASE_URL
              value: "https://api.themoviedb.org/3"
            - name: PORT
              value: "8088"
          envFrom:
            - secretRef:
                name: tmdb-config
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0-alpine
          envFrom:
            - secretRef:
                name: tmdb-config
          command: ["sh", "-c"]
          args:
            - exec /cloud-sql-proxy --port=5432 "$INSTANCE_CONNECTION_NAME"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tmdb-secrets
